# Builds the playable program when a version tag is pushed, and attaches the
# binaries to a GitHub release.
#
# A binary is less useful here than it would be for most games: it still needs
# the player's own copy of Robin of the Wood to run, and refuses to start without one.
# It saves them installing Rust, and that is all it saves them. See assets/README.md.
#
# Linux, macOS and Windows — the same three CI builds and tests on. A target
# is only shipped once something proves it works.

name: Release

on:
  push:
    tags:
      - "v*"
  # So the build can be exercised without minting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Every `run:` below is a bash script; Windows would otherwise use
    # PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled: GitHub no longer has Intel macOS runners, and a
          # job asking for `macos-13` waits in the queue forever. The smoke
          # test below runs the result under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # What the window and gamepad crates need to build on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --release --locked --all-features -p robin --target ${{ matrix.target }}

      # Proves the binary starts on its runner: from an empty folder it must
      # say it found no tape and exit 1, which is as far as it gets without
      # one. Headless, because a windowed start with no tape opens a window to
      # ask for it, and a runner has no display. Not on Windows, where a release build says that in a dialog box
      # and the job would wait for somebody to close it.
      - name: Smoke test
        if: runner.os != 'Windows'
        run: |
          bin="$PWD/target/${{ matrix.target }}/release/robin"
          empty=$(mktemp -d)
          cd "$empty"
          set +e
          out=$("$bin" --headless 1 "$empty/shots" 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] && grep -q "No tape found" <<< "$out"

      # Named for the target, since four of these land in one release. A
      # tarball everywhere but Windows, where a zip is what Explorer opens
      # without being asked twice.
      - name: Package
        run: |
          # A tag is a plain name, but a branch can carry slashes, and the
          # whole point of workflow_dispatch is trying this before a tag
          # exists. `mkdir robin-feat/thing-x86_64-...` fails.
          ref="${GITHUB_REF_NAME//\//-}"
          dir="robin-$ref-${{ matrix.target }}"
          mkdir "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/robin.exe "$dir/"
          else
            cp target/${{ matrix.target }}/release/robin "$dir/"
          fi
          cp LICENSE-MIT LICENSE-APACHE "$dir/"
          cp THIRD-PARTY.md "$dir/THIRD-PARTY.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          # The player still needs their own tape, and saying so at the point
          # of download saves somebody a confusing first run.
          body: |
            Built from `${{ github.ref_name }}`.

            **You need your own copy of Robin of the Wood (the 128K tape) to play.** This program contains no part of the original game. It reads the graphics, maps, text and sound from your tape when it starts.

            Put the tape in the same folder as the program and run it, or give it on the command line: `./robin path/to/tape.tzx`, or `robin.exe path\to\tape.tzx` on Windows. 0 starts a game, Escape is BREAK, and F11 is full screen.

            **macOS:** the binary is not signed, so macOS blocks it the first time you run it. In Terminal, in the folder you extracted, run `xattr -d com.apple.quarantine robin`. Or try to open it once, then allow it under System Settings, Privacy & Security.

            **Gamepads** work as the Kempston joystick (the menu's 2), over USB or Bluetooth.
          fail_on_unmatched_files: true
          # A tag with a suffix, like v0.1.0-rc.1, is something to try before
          # the real one, so it is published as a pre-release and never
          # becomes the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

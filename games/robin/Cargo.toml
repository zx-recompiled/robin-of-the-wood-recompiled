[package]
name = "robin"
description = "Robin of the Wood (ZX Spectrum 128K), rewritten in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["frontend"]
# The playable program (window, sound and input). The library alone has no
# platform dependencies.
frontend = ["dep:pixels", "dep:winit", "dep:cpal", "dep:aym", "dep:gilrs", "dep:zip", "dep:fontdue", "dep:rfd"]

[dependencies]
zx-core.workspace = true
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
cpal = { version = "0.18", optional = true }
# The AY synthesiser: RustZX's `aym`, from the maintainer's copy in
# zx-sidekick (#67), pinned to a commit there; bumped deliberately.
aym = { git = "https://github.com/zx-sidekick/zx-sidekick", rev = "ad04d3fb5946c4b80357b45e05770a3eb2e1b631", optional = true }
gilrs = { version = "0.11", optional = true }
# Reading the tape out of the zip the archives serve it in. Deflate only,
# through the pure-Rust zlib; the other methods and encryption stay out.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
# The screen that asks for the tape: text in the bundled Inter (see fonts/),
# and the system's own open-file dialog.
fontdue = { version = "0.9", optional = true }
rfd = { version = "0.17", optional = true }

# Only to run the original for comparison; the game itself never does.
[dev-dependencies]
zx-runtime.workspace = true

[[bin]]
name = "robin"
required-features = ["frontend"]

[lints]
workspace = true
